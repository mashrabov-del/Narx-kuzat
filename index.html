<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Narx-solishtir - Shahrixon</title>
    <meta name="description" content="Shahrixondagi do'konlarda kiyim-kechak narxlari va sifatini solishtiring.">
    <!-- Supabase Kutubxonasi CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(12px);
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 480px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-sizing: border-box;
            margin-top: 5px;
        }

        h1 { 
            margin-top: 0; 
            color: #38bdf8;
            font-size: 22px; 
            text-align: center; 
            font-weight: 800;
            margin-bottom: 15px;
        }

        .nav-menu {
            display: flex;
            gap: 4px;
            margin-bottom: 15px;
            background: rgba(15, 23, 42, 0.7);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
        }

        .nav-btn {
            flex: 1;
            min-width: 70px;
            background: transparent;
            border: none;
            padding: 8px 4px;
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
        
        .search-box {
            margin-bottom: 15px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .file-upload-wrapper {
            margin-bottom: 10px;
        }

        .file-upload-input {
            display: none;
        }

        .file-upload-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            background: #0f172a;
            border: 2px dashed #475569;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            gap: 3px;
            width: 100%;
            box-sizing: border-box;
        }

        .file-main-text {
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
        }

        .file-sub-text {
            font-size: 11px;
            color: #94a3b8;
        }

        button.action-btn {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: transform 0.1s, opacity 0.2s;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        button.action-btn:active { 
            transform: scale(0.98);
        }

        .product-card {
            background: rgba(51, 65, 85, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 15px;
            color: #fb7185;
            margin-bottom: 8px;
            gap: 5px;
        }

        .product-img {
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .store-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 13px;
            padding: 5px 0;
            gap: 8px;
        }

        .store-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stock-badge {
            font-size: 11px;
            color: #94a3b8;
        }

        .badge {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            margin-left: 4px;
            white-space: nowrap;
        }

        .stars {
            color: #facc15;
            font-size: 12px;
            white-space: nowrap;
        }

        .reviews-section {
            margin-top: 6px;
            font-size: 12px;
            background: rgba(15, 23, 42, 0.5);
            padding: 8px;
            border-radius: 6px;
            border-left: 3px solid #6366f1;
        }

        .review-item {
            color: #cbd5e1;
            font-style: italic;
        }

        .warning-banner {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 8px;
            border-radius: 8px;
            font-size: 11px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            font-size: 11px;
            color: #94a3b8;
        }

        .report-btn {
            background: transparent;
            border: 1px solid #ef4444;
            color: #f87171;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
        }

        .profile-box {
            background: rgba(15, 23, 42, 0.5);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .loader {
            text-align: center;
            color: #38bdf8;
            padding: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Narx-qiyosla</h1>
        
        <div class="nav-menu">
            <button class="nav-btn active" onclick="switchTab('productsTab', this)">Mahsulotlar</button>
            <button class="nav-btn" onclick="switchTab('addTab', this)">➕ Qo'shish</button>
            <button class="nav-btn" onclick="switchTab('profileTab', this)">👤 Profil</button>
            <button class="nav-btn" id="adminNavBtn" onclick="switchTab('adminTab', this)" style="display:none; color: #f43f5e;">🛡️ Admin</button>
        </div>

        <!-- 1. Mahsulotlar Tab -->
        <div id="productsTab" class="tab-content active">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Qidirish (masalan: Qishki Kurtka)..." oninput="filterProducts()">
            </div>
            <div id="productList">
                <div class="loader">Ma'lumotlar yuklanmoqda...</div>
            </div>
        </div>

        <!-- 2. Qo'shish Tab -->
        <div id="addTab" class="tab-content">
            <div class="add-section">
                <h3>Do'kondan kiyim narxi qo'shish</h3>
                <input type="text" id="newName" placeholder="Mahsulot nomi (Majburiy) *">
                <input type="text" id="newStore" placeholder="Do'kon nomi (Majburiy) *">
                <input type="number" id="newPrice" placeholder="Narxi so'mda (Majburiy) *" step="1000" min="0">
                <input type="number" id="newStock" placeholder="Qolgan soni / dona (Ixtiyoriy)" min="0">
                
                <div class="file-upload-wrapper">
                    <input type="file" id="newImage" class="file-upload-input" accept="image/*" onchange="previewFileName(this)">
                    <label for="newImage" class="file-upload-btn">
                        <span class="file-main-text">📁 Rasm tanlash (Ixtiyoriy)</span>
                        <span class="file-sub-text" id="fileChosenText">Fayl tanlanmagan</span>
                    </label>
                </div>

                <select id="newRating">
                    <option value="">Baholashni tanlang (Ixtiyoriy)</option>
                    <option value="5">⭐⭐⭐⭐⭐ (A'lo sifat)</option>
                    <option value="4">⭐⭐⭐⭐ (Yaxshi)</option>
                    <option value="3">⭐⭐⭐ (O'rtacha)</option>
                    <option value="2">⭐⭐ (Yomon)</option>
                    <option value="1">⭐ (Juda yomon)</option>
                </select>
                <textarea id="newReview" placeholder="Izoh yozish (Ixtiyoriy)..." rows="2"></textarea>
                <button class="action-btn" onclick="addProduct()">Qo'shish</button>
            </div>
        </div>

        <!-- 3. Profil Tab -->
        <div id="profileTab" class="tab-content">
            <div class="profile-box">
                <div id="loggedOutView">
                    <h3 style="color: #e2e8f0; font-size: 16px; margin-top:0;">Tizimga kirish</h3>
                    <p style="font-size: 13px; color: #94a3b8; margin-bottom: 15px;">Mahsulot qo'shish uchun emailingiz bilan kiring.</p>
                    <input type="email" id="authEmail" placeholder="Email manzilingiz...">
                    <input type="password" id="authPassword" placeholder="Parol...">
                    <button class="action-btn" onclick="loginUser()" style="margin-bottom: 10px;">Kirish</button>
                    <button class="action-btn" onclick="registerUser()" style="background: transparent; border: 1px solid #6366f1;">Ro'yxatdan o'tish</button>
                </div>

                <div id="loggedInView" style="display:none;">
                    <h3 style="color: #38bdf8; font-size: 16px; margin-top:0;">Xush kelibsiz!</h3>
                    <p id="userEmailDisplay" style="font-size: 14px; color: #cbd5e1; margin-bottom: 20px; word-break: break-all;"></p>
                    <button class="action-btn" onclick="logoutUser()" style="background: #ef4444;">Tizimdan chiqish</button>
                </div>
            </div>
        </div>

        <!-- 4. Admin Tab -->
        <div id="adminTab" class="tab-content">
            <h3 style="color: #f43f5e; font-size: 16px; margin-top: 0;">🛡️ Shikoyat qilingan mahsulotlar</h3>
            <p style="font-size: 12px; color: #94a3b8; margin-bottom: 15px;">Bu yerda foydalanuvchilar shikoyat qilgan mahsulotlar ro'yxati ko'rinadi.</p>
            <div id="adminReportedList">
                <div class="loader">Yuklanmoqda...</div>
            </div>
        </div>
    </div>
    
    <script>   
        const SUPABASE_URL = 'https://flzmgexkhhdvjnmcibqi.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_IhrM4o-fRW-wD4PVj-f1-g_k-rFaSDJ';
        
        // ADMINNING EMAIL MANZILI
        const ADMIN_EMAIL = "sizning_oson_emailingiz@gmail.com"; // <-- O'ZINGIZNING EMAILINGIZ BILAN ALMASHTIRING!
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let products = [];
        let reportedProductIds = new Set();
        let currentUser = null;

        document.addEventListener("DOMContentLoaded", async () => {
            await checkUser();
            await fetchReportsList();
            fetchProducts();
        });

        async function checkUser() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            currentUser = session?.user || null;
            updateAuthUI();
        }

        function updateAuthUI() {
            const loggedOutView = document.getElementById("loggedOutView");
            const loggedInView = document.getElementById("loggedInView");
            const adminNavBtn = document.getElementById("adminNavBtn");

            if (currentUser) {
                loggedOutView.style.display = "none";
                loggedInView.style.display = "block";
                document.getElementById("userEmailDisplay").textContent = currentUser.email;

                if (currentUser.email === ADMIN_EMAIL) {
                    adminNavBtn.style.display = "block";
                    fetchReportedProducts();
                } else {
                    adminNavBtn.style.display = "none";
                }
            } else {
                loggedOutView.style.display = "block";
                loggedInView.style.display = "none";
                adminNavBtn.style.display = "none";
            }
        }

        async function loginUser() {
            const email = document.getElementById("authEmail").value.trim();
            const password = document.getElementById("authPassword").value.trim();

            if (!email || !password) {
                alert("Iltimos, email va parolni kiriting!");
                return;
            }

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                alert("Xatolik: " + error.message);
                return;
            }
            currentUser = data.user;
            updateAuthUI();
            alert("Muvaffaqiyatli kirdingiz!");
            switchTab('productsTab', document.querySelector('.nav-btn'));
        }

        async function registerUser() {
            const email = document.getElementById("authEmail").value.trim();
            const password = document.getElementById("authPassword").value.trim();

            if (!email || !password) {
                alert("Iltimos, email va parolni kiriting!");
                return;
            }

            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if (error) {
                alert("Xatolik: " + error.message);
                return;
            }
            alert("Ro'yxatdan o'tdingiz!");
        }

        async function logoutUser() {
            await supabaseClient.auth.signOut();
            currentUser = null;
            updateAuthUI();
            switchTab('productsTab', document.querySelector('.nav-btn'));
            alert("Tizimdan chiqdingiz.");
        }

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if (btnElement) btnElement.classList.add('active');

            if (tabId === 'adminTab' && currentUser && currentUser.email === ADMIN_EMAIL) {
                fetchReportedProducts();
            }
        }

        function previewFileName(input) {
            const fileChosenText = document.getElementById('fileChosenText');
            if (input.files && input.files[0]) {
                fileChosenText.textContent = "Tanlandi: " + input.files[0].name;
                fileChosenText.style.color = "#38bdf8";
            } else {
                fileChosenText.textContent = "Fayl tanlanmagan";
                fileChosenText.style.color = "#94a3b8";
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Shikoyat qilingan mahsulot ID'larini olib kelish
        async function fetchReportsList() {
            const { data, error } = await supabaseClient.from('reports').select('product_id');
            if (!error && data) {
                reportedProductIds = new Set(data.map(r => String(r.product_id)));
            }
        }

        // Hamma mahsulotlarni yuklaymiz (hech qaysi yashirilmaydi)
        async function fetchProducts() {
            await fetchReportsList();
            const { data, error } = await supabaseClient
                .from('products')
                .select('*')
                .order('price', { ascending: true });

            if (error) {
                console.error("Xatolik yuz berdi:", error.message);
                document.getElementById("productList").innerHTML = `<div style="text-align: center; color: #f87171; padding: 20px;">Ma'lumotlarni yuklab bo'lmadi.</div>`;
                return;
            }

            products = data || [];
            displayProducts(products);
        }

        function displayProducts(items) {
            const listContainer = document.getElementById("productList");
            listContainer.innerHTML = "";

            let grouped = {};
            items.forEach(item => {
                if (!grouped[item.name]) grouped[item.name] = [];
                grouped[item.name].push(item);
            });

            if (Object.keys(grouped).length === 0) {
                listContainer.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 20px;">Hech qanday mahsulot topilmadi.</div>`;
                return;
            }

            for (let productName in grouped) {
                let entries = grouped[productName];
                let cheapest = [...entries].sort((a, b) => a.price - b.price)[0];
                let bestQuality = [...entries].sort((a, b) => (b.rating || 0) - (a.rating || 0))[0];

                let card = document.createElement("div");
                card.className = "product-card";

                let header = document.createElement("div");
                header.className = "product-header";
                header.innerHTML = `<span>${escapeHtml(productName)}</span>`;
                card.appendChild(header);

                let contentDiv = document.createElement("div");
                let highlightList = [cheapest];
                if (bestQuality && bestQuality.id !== cheapest.id) {
                    highlightList.push(bestQuality);
                }

                highlightList.forEach((e, index) => {
                    // Agar bu mahsulotga shikoyat tushgan bo'lsa, ogohlantirish bannerini chiqaramiz
                    if (reportedProductIds.has(String(e.id))) {
                        let warningDiv = document.createElement("div");
                        warningDiv.className = "warning-banner";
                        warningDiv.innerHTML = `⚠️ <strong>Diqqat:</strong> Bu do'kondagi narx yoki ma'lumot bo'yicha foydalanuvchilar shikoyat qilishgan! Ehtiyot bo'ling.`;
                        contentDiv.appendChild(warningDiv);
                    }

                    if (index === 0 && e.image) {
                        let imgElement = document.createElement("img");
                        imgElement.src = e.image;
                        imgElement.className = "product-img";
                        imgElement.alt = productName;
                        contentDiv.appendChild(imgElement);
                    }

                    let starsHtml = e.rating ? "⭐".repeat(e.rating) : "";
                    let badges = "";
                    if (e.id === cheapest.id) badges += `<span class="badge" style="background: rgba(34, 197, 94, 0.2); color: #22c55e;">🔥 Eng arzon</span>`;
                    if (e.id === bestQuality.id && (e.rating || 0) > 0) badges += `<span class="badge" style="background: rgba(59, 130, 246, 0.2); color: #3b82f6;">⭐ Eng sifatli</span>`;

                    let formattedPrice = Number(e.price).toLocaleString('uz-UZ');
                    let stockText = (e.stock !== null && e.stock !== undefined && e.stock !== "") ? `<span class="stock-badge">Qoldiq: ${e.stock} dona</span>` : "";
                    
                    let storeItem = document.createElement("div");
                    storeItem.className = "store-item";
                    storeItem.innerHTML = `
                        <div class="store-info">
                            <span><strong>${escapeHtml(e.store)}</strong> ${badges}</span>
                            ${stockText}
                        </div>
                        <span><span style="font-weight: 500;">${formattedPrice} so'm</span> <span class="stars">${starsHtml}</span></span>
                    `;
                    contentDiv.appendChild(storeItem);

                    if (e.review && e.review.trim() !== "") {
                        let reviewSec = document.createElement("div");
                        reviewSec.className = "reviews-section";
                        reviewSec.innerHTML = `<div class="review-item">"${escapeHtml(e.review)}"</div>`;
                        contentDiv.appendChild(reviewSec);
                    }

                    let uploaderInfo = e.user_email ? `Kiritdi: ${e.user_email.split('@')[0]}...` : "Noma'lum";
                    let footerDiv = document.createElement("div");
                    footerDiv.className = "card-footer";
                    footerDiv.innerHTML = `
                        <span>${uploaderInfo}</span>
                        <button type="button" class="report-btn" onclick="reportProduct('${e.id}')">⚠️ Shikoyat</button>
                    `;
                    contentDiv.appendChild(footerDiv);

                    if (index < highlightList.length - 1) {
                        let divider = document.createElement("div");
                        divider.style.cssText = "border-top: 1px dashed rgba(255,255,255,0.1); margin: 8px 0;";
                        contentDiv.appendChild(divider);
                    }
                });

                card.appendChild(contentDiv);
                listContainer.appendChild(card);
            }
        }

        function filterProducts() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(query));
            displayProducts(filtered);
        }

        function reportProduct(productId) {
            const existingModal = document.getElementById('reportModal');
            if (existingModal) existingModal.remove();

            const modal = document.createElement('div');
            modal.id = 'reportModal';
            modal.style.cssText = `
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 9999;
            `;

            modal.innerHTML = `
                <div style="background: #1e293b; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; color: #fff; box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
                    <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 18px;">⚠️ Shikoyat sababi</h3>
                    <textarea id="reportReasonInput" placeholder="Sababini yozing (masalan: Narxi boshqacha ekan)..." style="width: 100%; height: 80px; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 8px; resize: none; margin-bottom: 15px; box-sizing: border-box;"></textarea>
                    <div style="display: flex; justify-content: flex-end; gap: 10px;">
                        <button type="button" id="cancelReportBtn" style="background: #475569; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">Bekor qilish</button>
                        <button type="button" id="submitReportBtn" style="background: #ef4444; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">Yuborish</button>
                    </div>
                </div>
            `;

            document.body.appendChild(modal);

            document.getElementById('cancelReportBtn').onclick = () => modal.remove();
            modal.onclick = (e) => { if (e.target === modal) modal.remove(); };

            document.getElementById('submitReportBtn').onclick = async () => {
                const reason = document.getElementById('reportReasonInput').value.trim();
                if (!reason) {
                    alert("Iltimos, sababini yozing!");
                    return;
                }

                await supabaseClient.from('reports').insert([{
                    product_id: productId,
                    user_email: currentUser ? currentUser.email : 'Mehmon',
                    reason: reason
                }]);

                modal.remove();
                alert("Shikoyatingiz yuborildi. Bu mahsulotda endi ogohlantirish belgisi paydo bo'ladi!");
                fetchProducts();
            };
        }

        // Admin menyusi: barcha shikoyatlarni ko'rish va tozalash
        async function fetchReportedProducts() {
            const container = document.getElementById("adminReportedList");
            container.innerHTML = `<div class="loader">Yuklanmoqda...</div>`;

            const { data: reportsData, error } = await supabaseClient
                .from('reports')
                .select('id, product_id, user_email, reason, created_at')
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = `<div style="color: #f87171;">Xatolik yuz berdi.</div>`;
                return;
            }

            if (!reportsData || reportsData.length === 0) {
                container.innerHTML = `<div style="color: #94a3b8; text-align: center; padding: 20px;">Hozircha hech qanday shikoyat yo'q.</div>`;
                return;
            }

            container.innerHTML = "";
            for (let rep of reportsData) {
                // Shikoyat qilingan mahsulot ma'lumotini topamiz
                const { data: prodData } = await supabaseClient
                    .from('products')
                    .select('name, store, price')
                    .eq('id', rep.product_id)
                    .single();

                let prodName = prodData ? `${prodData.name} (${prodData.store})` : "O'chirilgan mahsulot";

                let card = document.createElement("div");
                card.className = "product-card";
                card.style.border = "1px solid #f43f5e";
                
                card.innerHTML = `
                    <div style="font-weight: bold; color: #f43f5e; margin-bottom: 5px;">${escapeHtml(prodName)}</div>
                    <div style="font-size: 12px; background: rgba(244, 63, 94, 0.1); padding: 8px; border-radius: 6px; margin-bottom: 10px;">
                        <strong>Sabab:</strong> "${escapeHtml(rep.reason)}"<br>
                        <span style="color: #94a3b8; font-size: 11px;">Yubordi: ${rep.user_email}</span>
                    </div>
                    <button onclick="clearReport('${rep.id}')" style="width: 100%; background: #ef4444; color: white; border: none; padding: 6px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;">Shikoyatni o'chirish (Tozalash)</button>
                `;
                container.appendChild(card);
            }
        }

        // Admin shikoyatni asossiz deb topsa, o'chirib tashlaydi (shunda mahsulotdan ogohlantirish yo'qoladi)
        async function clearReport(reportId) {
            if (!confirm("Bu shikoyatni o'chirishni xohlaysizmi?")) return;

            const { error } = await supabaseClient.from('reports').delete().eq('id', reportId);
            if (error) {
                alert("Xatolik: " + error.message);
            } else {
                alert("Shikoyat tozalandi.");
                fetchReportedProducts();
                fetchProducts();
            }
        }

        async function addProduct() {
            if (!currentUser) {
                alert("Mahsulot qo'shish uchun avval '👤 Profil' bo'limiga o'tib tizimga kiring!");
                switchTab('profileTab', document.querySelectorAll('.nav-btn')[2]);
                return;
            }

            const name = document.getElementById("newName").value.trim();
            const store = document.getElementById("newStore").value.trim();
            const priceInput = document.getElementById("newPrice").value;
            const price = Number(priceInput);

            if (!name || !store || !priceInput || isNaN(price)) {
                alert("Xatolik: Mahsulot nomi, do'kon va narxi kiritilishi shart!");
                return;
            }

            const stockInput = document.getElementById("newStock").value;
            const stock = stockInput !== "" ? Number(stockInput) : null;
            const ratingInput = document.getElementById("newRating").value;
            const rating = ratingInput !== "" ? Number(ratingInput) : null;
            const review = document.getElementById("newReview").value.trim();
            const imageInput = document.getElementById("newImage");

            const saveToCloud = async (imageUrl) => {
                const { error } = await supabaseClient
                    .from('products')
                    .insert([{ 
                        name, 
                        store, 
                        price, 
                        stock, 
                        rating, 
                        review, 
                        image: imageUrl,
                        user_id: currentUser.id,
                        user_email: currentUser.email
                    }]);

                if (error) {
                    alert("Xatolik yuz berdi: " + error.message);
                    return;
                }

                document.getElementById("newName").value = "";
                document.getElementById("newStore").value = "";
                document.getElementById("newPrice").value = "";
                document.getElementById("newStock").value = "";
                document.getElementById("newImage").value = "";
                document.getElementById("fileChosenText").textContent = "Fayl tanlanmagan";
                document.getElementById("fileChosenText").style.color = "#94a3b8";
                document.getElementById("newRating").value = "";
                document.getElementById("newReview").value = "";
                
                alert("Mahsulot muvaffaqiyatli qo'shildi!");
                fetchProducts();
                switchTab('productsTab', document.querySelectorAll('.nav-btn')[0]);
            };

            if (imageInput.files && imageInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    saveToCloud(e.target.result);
                };
                reader.readAsDataURL(imageInput.files[0]);
            } else {
                saveToCloud("");
            }
        }
    </script>
</body>
</html>
